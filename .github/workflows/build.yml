name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Native arm64 runner (free for public repos): no QEMU.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "opencode=$(sed -n 's/^ARG OPENCODE_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.opencode }}-${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.opencode }}
            ghcr.io/${{ github.repository }}:latest
      - name: smoke test
        run: |
          img=ghcr.io/${{ github.repository }}:${{ steps.v.outputs.opencode }}
          docker run --rm "$img" --version
          docker run --rm --entrypoint bash "$img" -c 'id; git --version; gh --version | head -1; mise --version; rg --version | head -1'
