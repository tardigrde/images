name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Each image variant builds natively on amd64 and arm64 (no QEMU), pushes by
# digest, then a merge job joins the two digests into one multi-arch tag.
jobs:
  build:
    name: build ${{ matrix.variant }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [server, eval]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/${{ github.repository }}${{ matrix.variant == 'eval' && '-eval' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (PR) - load into the local daemon for the smoke test
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          tags: smoke:${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.arch }}
      - name: Build (main) - push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.arch }}
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.arch }}
      - name: Smoke test
        if: github.event_name == 'pull_request'
        run: |
          if [ "${{ matrix.variant }}" = server ]; then
            docker run --rm smoke:server --version
            docker run --rm --entrypoint bash smoke:server -c 'id; git --version; gh --version | head -1; mise --version; rg --version | head -1'
          else
            docker run --rm smoke:eval bash -c 'test "$(id -u)" = 0; git --version; gh --version | head -1; rg --version | head -1; /root/.harbor/agents/opencode-v2/node_modules/.bin/opencode --version'
          fi
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish ${{ matrix.variant }}
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [server, eval]
    env:
      IMAGE: ghcr.io/${{ github.repository }}${{ matrix.variant == 'eval' && '-eval' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        # The tag is the version of the opencode CLI inside the variant.
        run: |
          if [ "${{ matrix.variant }}" = eval ]; then arg=OPENCODE_V2_VERSION; else arg=OPENCODE_VERSION; fi
          echo "opencode=$(sed -n "s/^ARG ${arg}=//p" Dockerfile)" >> "$GITHUB_OUTPUT"
      - name: Create the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          v=${{ steps.v.outputs.opencode }}
          docker buildx imagetools create \
            -t "$IMAGE:$v-${{ github.sha }}" -t "$IMAGE:$v" -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Smoke test
        run: |
          v=${{ steps.v.outputs.opencode }}
          docker buildx imagetools inspect "$IMAGE:$v"
          if [ "${{ matrix.variant }}" = server ]; then
            docker run --rm "$IMAGE:$v" --version
          else
            docker run --rm "$IMAGE:$v" /root/.harbor/agents/opencode-v2/node_modules/.bin/opencode --version
          fi
